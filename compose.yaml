# Local development stack. `mvn spring-boot:run` starts it automatically
# (spring-boot-docker-compose). Ollama only starts with the "ollama" profile,
# so you can use a native Ollama install instead.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sepainst
      POSTGRES_USER: sepainst
      POSTGRES_PASSWORD: sepainst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
