# Local development stack. `./mvnw spring-boot:run` starts it automatically
# (spring-boot-docker-compose). Models run remotely (Gemini embeddings), not here.
services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    labels:
      # Tells Spring Boot this is a PostgreSQL service, so it configures the DataSource for it.
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: sepainst
      POSTGRES_USER: sepainst
      POSTGRES_PASSWORD: sepainst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
