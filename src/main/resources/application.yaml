spring:
  application:
    name: sepa-inst-assistant

  docker:
    compose:
      # Start the database if needed, but leave it running when the app stops (handy for psql).
      lifecycle-management: start-only

  # Used when the database is started outside Spring Boot (e.g. `podman compose up -d`).
  # When Spring Boot starts compose.yaml itself, it overrides these automatically.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sepainst}
    username: ${DATABASE_USERNAME:sepainst}
    password: ${DATABASE_PASSWORD:sepainst}

  ai:
    model:
      embedding:
        text: google-genai
    google:
      genai:
        embedding:
          # Free key from Google AI Studio (https://aistudio.google.com). Never commit it.
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            # gemini-embedding-001 defaults to 3072 dimensions; 768 is one of Google's recommended
            # sizes and stays within pgvector's HNSW index limit.
            dimensions: ${EMBEDDING_DIMENSIONS:768}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine-distance
        # Must match the embedding output size configured above.
        dimensions: ${EMBEDDING_DIMENSIONS:768}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

sepainst:
  sources:
    # Downloaded documents are kept here and never committed (see .gitignore).
    directory: sources
    documents:
      - id: EPC122-16-2025
        title: EPC122-16 SCT Inst Inter-PSP Implementation Guidelines 2025 v1.0
        url: https://www.europeanpaymentscouncil.eu/sites/default/files/kb/file/2024-11/EPC122-16%20SCT%20Inst%20Inter-PSP%20IG%202025%20V1.0.pdf
  ingestion:
    max-chunk-chars: 2000
    # Gemini free tier allows about 30k tokens per minute: ~20 chunks of 2,000 characters,
    # then a pause. With a paid key, raise the batch size and set the pause to 0s.
    batch-size: 20
    pause-between-batches: 30s
    download-timeout: 60s
