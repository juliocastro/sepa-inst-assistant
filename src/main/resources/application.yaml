spring:
  application:
    name: sepa-inst-assistant

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Models are pulled manually (see README) so startup never blocks on a large download.
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine-distance
        # Must match the embedding model output size (nomic-embed-text = 768).
        dimensions: ${EMBEDDING_DIMENSIONS:768}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

sepainst:
  sources:
    # Downloaded documents are kept here and never committed (see .gitignore).
    directory: sources
    documents:
      - id: EPC122-16-2025
        title: EPC122-16 SCT Inst Inter-PSP Implementation Guidelines 2025 v1.0
        url: https://www.europeanpaymentscouncil.eu/sites/default/files/kb/file/2024-11/EPC122-16%20SCT%20Inst%20Inter-PSP%20IG%202025%20V1.0.pdf
  ingestion:
    max-chunk-chars: 2000
    batch-size: 50
    download-timeout: 60s
